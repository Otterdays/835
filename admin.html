<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel — Local 835</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="profile.css">
<script src="js/auth.js"></script>
</head>
<body class="account-page">
<button id="menu-btn" class="menu-btn" type="button" aria-label="Open Menu" aria-expanded="false">☰</button>
<div id="side-panel" class="side-panel">
    <div class="panel-header">
        <h2>Navigation</h2>
        <button id="close-btn" class="close-btn" type="button" aria-label="Close Menu">×</button>
    </div>
    <ul class="nav-links" id="nav-links" aria-label="Site navigation"></ul>
</div>
<div id="panel-overlay" class="panel-overlay"></div>

<main class="container account-container adm-container" id="main-container">
    <nav class="breadcrumb" aria-label="Breadcrumb" data-page-title="Admin Panel"></nav>

    <header class="account-head">
        <h1>Admin panel</h1>
        <p>Manage member accounts, roles and titles. Every change is recorded in the log at the bottom of this page.</p>
    </header>

    <form id="adm-search" class="adm-search" role="search">
        <label class="pf-field">
            <span class="pf-field-label">Find an account</span>
            <input type="search" name="q" placeholder="Username or display name" autocomplete="off" maxlength="40">
        </label>
        <button class="pf-btn pf-btn--primary" type="submit">Search</button>
    </form>
    <p id="adm-count" class="pf-muted" aria-live="polite">Loading accounts…</p>

    <div id="adm-list" class="adm-list"></div>

    <details class="pf-box adm-audit" id="adm-audit">
        <summary class="pf-box-title">Recent admin actions</summary>
        <div id="adm-audit-body" class="pf-box-body"><p class="pf-muted">Open to load the log.</p></div>
    </details>
</main>

<script src="js/nav-config.js"></script>
<script src="js/shell.js"></script>
<script src="js/site-search.js"></script>
<script src="js/profile-ui.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
